name: Android Input

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-input.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  captured-mouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true
      - name: Prepare Android plugin test host
        run: |
          flutter create --platforms=android --project-name mouse_history_test "$RUNNER_TEMP/mouse_history_test"
          cd "$RUNNER_TEMP/mouse_history_test"
          flutter pub add hardware_simulator --path "$GITHUB_WORKSPACE"
      - name: Test captured mouse movement
        working-directory: ${{ runner.temp }}/mouse_history_test/android
        run: ./gradlew :hardware_simulator:testDebugUnitTest --console=plain
